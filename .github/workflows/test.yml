name: Test
on:
  workflow_call:
  push:
    branches:
      - "**"
      - "!dependabot/**"
  pull_request:
  schedule:
    # monthly https://crontab.guru/#0_0_10_*_*
    - cron: "0 0 10 * *"
  workflow_dispatch:

permissions: {}
jobs:
  test:
    uses: bats-hardened/.github/.github/workflows/test.yml@v1
    permissions:
      contents: read
      security-events: write
      id-token: write
